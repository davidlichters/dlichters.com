<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ecommerce Playbook</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<style>.gn{position:absolute;top:0;left:0;right:0;z-index:9999;height:48px;
--sfd:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--sft:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
--cb:cubic-bezier(.4,0,.6,1)}
.gn ul{list-style:none;margin:0;padding:0}
.gn-content{--rate:375ms;position:absolute;top:0;left:0;width:100%;height:48px;overflow:hidden;
background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
transition:height var(--rate) var(--cb) 80ms,background var(--rate) var(--cb) 80ms}
.gn-open .gn-content{height:100vh;height:100dvh;background:#fafafc;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;transition-delay:0ms}
.gn-menu,.gn-submenu{position:absolute;top:0;left:0;width:100%}
.gn-flyout{padding-top:50px;box-sizing:border-box}
.gn-menu-list{display:flex;flex-direction:column;padding-bottom:84px}
.gn-item{opacity:0;transform:translateY(-8px);
transition:opacity .24s var(--cb) calc(.2s + var(--n) * 20ms),transform .24s var(--cb) calc(.2s + var(--n) * 20ms)}
.gn-open .gn-item{opacity:1;transform:none}
.gn-closing .gn-item{transition-delay:0s;transition-duration:min(.16s + 20ms * (8 - var(--n)),.24s)}
.gn-sub .gn-item{transition:none}
.gn-sub:not(.gn-anim) .gn-item{opacity:0;visibility:hidden;transform:translate(-8px)}
.gn-item:first-child{margin-top:-3px}
.gn-link{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:-7px;padding:3px 48px 4px;
color:#333336;text-decoration:none;font-family:var(--sfd);font-size:28px;line-height:1.1428571429;font-weight:600;
letter-spacing:-.0066em;pointer-events:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-open .gn-link{pointer-events:auto}
.gn-link:hover,.gn-link:focus-visible{color:#000}
.gn-link:focus{outline:none}
.gn-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-link-text{pointer-events:none;padding-top:7.5px;padding-bottom:7.5px}
.gn-link-chevron{display:block;height:47px;margin-top:-1px;margin-right:-48px;padding-right:19px;color:#333336;
opacity:0;visibility:hidden;transform:scale(.8);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-link-chevron svg{fill:currentColor;transform:scaleX(-1) translateZ(0)}
@media (hover:hover){.gn-open:not(.gn-sub):not(.gn-closing) .gn-link:hover .gn-link-chevron{visibility:visible;
opacity:1;transform:none;transition:visibility .24s step-start;animation:gn-chevron-in .24s var(--cb) both}}
@keyframes gn-chevron-in{0%{opacity:0;transform:translate(-4px)}to{opacity:1;transform:translate(0)}}
.gn-submenu{opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}
.gn-sub .gn-submenu{opacity:1;visibility:visible;pointer-events:auto}
.gn.gn-closing .gn-submenu{opacity:0;transform:translateY(-8px);transition:opacity .24s var(--cb),transform .24s var(--cb)}
.gn-submenu-content{display:flex;flex-wrap:wrap;padding:50px 48px 0;box-sizing:border-box}
.gn-submenu-group{padding-bottom:92px}
.gn-submenu-header{margin:0;color:#6e6e73;font-family:var(--sft);font-size:17px;line-height:1.2353641176;
font-weight:400;letter-spacing:.0033em}
.gn-submenu-list-item{margin:0 -11px;font-family:var(--sft);font-size:17px;line-height:1.4705882353;font-weight:600;
letter-spacing:-.022em}
.gn-submenu-list-item:first-child{margin-top:14px}
.gn-submenu-link{display:flex;align-items:center;max-width:max-content;padding:8px 11px 7px;margin-bottom:-5px;
color:#333336;text-decoration:none;transition:color .32s var(--cb);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-submenu-link:hover,.gn-submenu-link:focus-visible{color:#000}
.gn-submenu-link:focus{outline:none}
.gn-submenu-link:focus-visible{outline:2px solid #0071e3;outline-offset:-7px}
.gn-fwd .gn-menu .gn-link-text{animation:gn-fwd-prev .24s var(--cb) both}
.gn-fwd .gn-submenu{animation:gn-fwd-next .24s var(--cb) .16s both}
.gn-bwd .gn-submenu{animation:gn-bwd-prev .24s var(--cb) both}
.gn-bwd .gn-menu .gn-link-text{animation:gn-bwd-next .24s var(--cb) .16s both}
@keyframes gn-fwd-next{0%{opacity:0;transform:translate(8px)}to{opacity:1;transform:translate(0)}}
@keyframes gn-fwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(-8px)}}
@keyframes gn-bwd-prev{0%{opacity:1;transform:translate(0)}to{opacity:0;transform:translate(8px)}}
@keyframes gn-bwd-next{0%{opacity:0;transform:translate(-8px)}to{opacity:1;transform:translate(0)}}
.gn-menuback{position:absolute;top:0;left:max(0px,env(safe-area-inset-left) - 18px);z-index:3;width:48px;height:48px;
opacity:0;pointer-events:none;visibility:hidden;transform:translate(4px) scale(1);transform-origin:center;
transition:opacity .24s var(--cb),transform .24s var(--cb),visibility .24s step-end}
.gn-sub:not(.gn-bwd):not(.gn-closing) .gn-menuback{visibility:visible;transform:translate(0) scale(1);opacity:1;pointer-events:auto;
transition:opacity .24s var(--cb) .16s,transform .24s var(--cb) .16s,visibility .24s step-start .16s}
.gn.gn-closing .gn-menuback{opacity:0;transform:translate(0) scale(.8)}
.gn button:focus:not(:focus-visible){outline:none}
.gn-menuback-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;
padding:0;font:inherit;cursor:pointer;outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.gn-menuback-button{display:flex;justify-content:center;width:100%;height:100%;color:#333336;transition:color .32s var(--cb)}
.gn-menuback-button:hover{color:#000}
.gn-chevron-icon{display:flex;margin-left:-1px}
.gn-chevron-icon svg{fill:currentColor}

.gn-page{--rate:375ms;position:fixed;pointer-events:none}
.gn-page a,.gn-page a:hover{text-decoration:none}
.gn-page .gn-content,.gn-page.gn-open .gn-content{height:100vh;height:100dvh;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
overflow:hidden;transition:none;pointer-events:none}
.gn-page.gn-open .gn-content{pointer-events:auto}
.gn-page.gn-fertig .gn-content{overflow-x:hidden;overflow-y:auto}
.gn-schleier,.gn-tuch{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;pointer-events:none}
.gn-schleier{background:rgb(232,232,237);opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb)}
.gn-page.gn-open .gn-schleier{opacity:1;transition:opacity .36s var(--cb) .1s}
.gn-tuch{transform:translate3d(0,-100%,0);will-change:transform;transition:transform var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-tuch{transform:translate3d(0,0,0);transition-delay:0ms}
.gn-glas,.gn-voll{position:absolute;top:0;right:0;bottom:0;left:0}
.gn-glas{background:rgba(250,250,252,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.gn-voll{background:#fafafc;opacity:0;will-change:opacity;transition:opacity var(--rate) var(--cb) 80ms}
.gn-page.gn-open .gn-voll{opacity:1;transition-delay:0ms}
.gn-page.gn-fertig .gn-glas{visibility:hidden}
.gn-page .gn-item{will-change:opacity,transform}
.gn-strich{position:absolute;left:50%;top:50%;width:24px;height:6px;margin:-3px 0 0 -12px;will-change:transform}
.gn-strich-oben{transform:translate(0,-4px)}
.gn-strich-unten{transform:translate(0,3px)}
.gn-open .gn-strich-oben{animation:gn-oben-auf .24s linear both}
.gn-open .gn-strich-unten{animation:gn-unten-auf .24s linear both}
.gn-closing .gn-strich-oben{animation:gn-oben-zu .24s linear both}
.gn-closing .gn-strich-unten{animation:gn-unten-zu .24s linear both}
.gn-menutrigger{position:absolute;top:3px;right:max(0px,env(safe-area-inset-right) - 16px);z-index:3;width:48px;pointer-events:auto}
.gn-menutrigger-button{-webkit-appearance:none;appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;cursor:pointer;
outline-offset:-7px;-webkit-tap-highlight-color:rgba(0,0,0,0);position:relative;display:flex;justify-content:center;align-items:center;
width:48px;height:48px;color:#000;opacity:.8;transition:opacity .32s var(--cb),color .32s var(--cb)}
.gn-menutrigger-button:hover{opacity:1}
html.gn-lock,html.gn-lock body{overflow:hidden}
html.srch .gn{display:none}

sform:translate(0.000px,2.867px) rotate(0.000deg) scaleX(1.0000)}100.000%{transform:translate(0.000px,3.000px) rotate(0.000deg) scaleX(1.0000)}}
:root{--fg:#1d1d1f;--mut:#6e6e73;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
#feed{max-width:560px;margin:0 auto;padding:79px 0 40px}
.p{margin:0 0 47.04px}
.ph{display:flex;align-items:flex-start;height:32px;padding-left:10.7px}
.av{display:block;flex:none;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.16)}
.av img{display:block;width:32px;height:32px;border-radius:50%}
.who{position:relative;flex:1;height:32px;margin-left:9.3px;min-width:0}
.nm{position:absolute;top:-.21px;left:0;font-size:13.8px;line-height:17px;font-weight:600;letter-spacing:0;color:var(--fg);white-space:nowrap}
.sp{position:absolute;top:18.28px;left:0;font-size:11.6px;line-height:14px;text-decoration:none;color:var(--fg)}
.c{position:relative;margin-top:9.67px;background:#b3b3b4;container-type:inline-size}
.c::before{content:"";display:block;padding-top:75%}
.cr{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.cr::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#b3b3b4;color:#1d1d1f;padding:0 5.6%;container-type:inline-size}
.s .b{font-size:6.107vw;line-height:1.22;letter-spacing:-.012em;width:100%}
@supports (font-size:1cqw){.s .b{font-size:6.876cqw}}
.s h3{font:inherit;font-weight:600;margin:0 0 .5em}
.s p{margin:0 0 .5em}.s p:last-child{margin-bottom:0}
.s b{font-weight:600}
.s .tl{font-weight:600;font-size:1.25em;line-height:1.15;letter-spacing:-.018em}
.s .tl.m{font-size:1em;line-height:1.22;letter-spacing:-.012em}
.s .kl{display:block;font-size:.66em;line-height:1.3;font-weight:400;color:#1d1d1f;letter-spacing:0}
.s .kl:first-child{margin-bottom:.8em}.s .kl:last-child{margin-top:.8em}
.pl{position:absolute;top:14.4px;right:14.4px;min-width:36.25px;height:25.8px;padding:0 5.6px;border-radius:12.9px;background:rgba(45,45,45,.54);color:#fff;font-size:11.2px;line-height:25.8px;text-align:center;pointer-events:none;z-index:2}
/* Die Pille waechst mit der Slide-Breite: 36,25 von 393 pt wie in Davids Beispiel */
@supports (font-size:1cqw){.pl{top:3.664cqw;right:3.664cqw;min-width:9.224cqw;height:6.565cqw;padding:0 1.425cqw;border-radius:3.282cqw;font-size:2.85cqw;line-height:6.565cqw}}
.pf{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;font-size:18px;line-height:1;color:#1d1d1f}
.pf.l{left:10px}.pf.r{right:10px}
@media (hover:hover) and (pointer:fine){.c:hover .pf{display:flex}.c .pf[hidden]{display:none}}
.ic{position:relative;height:35.4px;margin-top:0}
.ic button,.ic a{position:absolute;display:block}
.ic svg{position:absolute;display:block;overflow:visible;fill:none;stroke:#1d1d1f;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.ic .pkt{fill:#1d1d1f;stroke:none}
.ic svg.ih{width:21.4px;height:19.8px}
.ic svg.ii{width:21.8px;height:21.8px}
.ic svg.is{width:19.2px;height:24px}
.ic svg.im{width:14.667px;height:23px}
/* Tippflaechen 44 pt, das Symbol sitzt genau wie in Davids Bild */
.ic .bl{left:2.6px;top:2.6px;width:44px;height:44px}.ic .bl svg{left:10.7px;top:11.4px}
.ic .bi{left:68.34px;top:2px;width:44px;height:44px}.ic .bi svg{left:10.9px;top:11.33px}
.ic .bs{left:132.99px;top:0;width:44px;height:44px}.ic .bs svg{left:12.6px;top:10.33px}/* Abstand wie in Davids zweitem Bild: Luecke 2,14-mal so breit wie die Symbole (98,5 zu 46 Bildpunkte), hier 44,5 pt (David 09.11.) */
.ic .bm{right:2px;top:1px;width:44px;height:44px}.ic .bm svg{left:14.667px;top:10.83px}
.bl.on svg{fill:#ff3b30;stroke:#ff3b30}
.bm.on svg{fill:#1d1d1f}
.bl.pop svg{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.72)}100%{transform:scale(1)}}
.tm{display:block;margin:14.14px 0 0 12.6px;font-size:11.8px;line-height:14px;color:var(--mut)}
#saved{position:fixed;top:3px;right:max(49.76px,calc(env(safe-area-inset-right) + 33.76px));z-index:9998;width:44px;height:48px;display:flex;align-items:center;justify-content:center}
#saved svg{display:block;width:14.667px;height:23px;fill:none;stroke:#1d1d1f;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
#saved.on svg{fill:#1d1d1f}
html.gn-lock #saved{visibility:hidden}
/* Davids Skizze 09.11.: Kapitelname fett, darunter lichters, mittig; Platz bis zum Merken-Symbol. Lage aus der Skizze (3-fach). */
#kopf{position:fixed;top:0;left:0;right:0;height:60px;background:#fff;z-index:9000}
#kt{position:absolute;top:16.64px;left:89.5px;right:89.5px;margin:0;font-size:16px;line-height:20px;font-weight:700;letter-spacing:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
#kn{position:absolute;top:36.2px;left:50%;transform:translateX(-50%);font-size:12.5px;line-height:16px;color:var(--fg);white-space:nowrap}
.leer{text-align:center;color:var(--mut);font-size:15px;line-height:1.4;padding:60px 24px}
#sent{height:1px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);background:rgba(29,29,31,.92);color:#fff;font-size:14px;line-height:1;padding:11px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999}
#toast.an{opacity:1;transform:translate(-50%,0)}</style>
</head><body>
