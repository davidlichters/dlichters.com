<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Veluxe setup</title><style>
:root{--t:#1d1d1f;--g:#6e6e73;--b:#d2d2d7;--a:#0071e3}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--t);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 80px}h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}h2{font-size:22px;margin:36px 0 8px}
p.lead{color:var(--g);margin:0 0 24px}ol,ul{padding-left:22px}li{margin:8px 0}a{color:var(--a)}.btn{display:inline-block;background:var(--t);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600}
.cp{margin:6px 0}.lab{font-size:13px;color:var(--g)}textarea{width:100%;font:14px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--b);border-radius:10px;padding:8px}

.note{background:#f5f5f7;border-radius:14px;padding:14px 16px;margin:20px 0}</style></head><body><main><h1>Your two policy texts</h1><p class="lead">They match the new theme: one delivery time, one 30-day guarantee, free shipping on 2+.</p><section><h2>Shipping policy</h2><p>Settings, Policies, Shipping policy: delete the old text, paste this, save.</p><div class="cp"><textarea id="t1" readonly rows="18">Shipping Policy

Where we ship
We ship to the United States, Canada, the United Kingdom, Ireland, Australia, New Zealand, Austria, Belgium, the Czech Republic, Denmark, Finland, France, Germany, Italy, the Netherlands, Norway, Poland, Portugal, Spain, Sweden and Switzerland. Orders of 2 or more hats ship free. A single hat ships for $4.99. Prices are shown in your local currency where available. If your country charges import duties or taxes on delivery, they are paid by the customer, unless your checkout shows them as included.

Your order confirmation
As soon as you place your order, we email you a confirmation with your order number and everything you bought. If it is not in your inbox within an hour, please look in your spam folder or write to helloveluxe8@gmail.com.

Processing time
We pack your order and hand it to the carrier within 2 to 3 business days (Monday to Friday, excluding holidays). Please check your shipping address at checkout. If it needs a change, email us before your order ships and we update it.

Shipping confirmation and tracking
When your hats are on their way, you get a second email with your tracking number and a link to follow the parcel. Every order ships with tracking.

Delivery time
After your order ships, delivery takes 14 to 21 business days. Counted from the day you order, that is 16 to 24 business days in total. The product page shows the expected delivery dates for an order placed today and, before Christmas, the last day to order for Christmas delivery.

Carriers
Your parcel travels with a tracked carrier that delivers in your country. The shipping email names the carrier and links straight to its tracking page.

Delays
Delivery times are estimates. Customs checks, bad weather and busy carriers in the weeks before Christmas can add a few days. If a delay is on our side, we email you. If your parcel has not arrived within the delivery window, or the tracking stops moving, write to helloveluxe8@gmail.com with your order number. We check with the carrier, and if the parcel is lost, we send a new one or refund your order.

Out of stock
We do not take custom orders. If an order cannot ship within 2 to 3 business days, we email you the new ship date and you can choose to cancel for a full refund.

Questions
Have a question about your delivery? Email helloveluxe8@gmail.com with your order number. A real person replies within one business day.</textarea><button onclick="c('t1',this)">Copy</button></div></section><section><h2>Refund policy</h2><p>Settings, Policies, Refund policy: delete the old text, paste this, save.</p><div class="cp"><textarea id="t2" readonly rows="18">Returns and Refunds

Our 30-day money-back guarantee
Every Veluxe order comes with a 30-day money-back guarantee. If the hat is not right for your dog, send it back within 30 days of delivery and we refund the full price. That includes the fit: if it does not sit well on your dog, it is covered too. If your order arrives damaged, faulty or not what you ordered, we replace it or refund you, at no cost to you.

What we need back
Trying the hat on your dog at home is fine, that is what the 30 days are for. Please send it back clean, free of dog hair and not damaged after delivery. Contact us before you send anything, so we can give you the return address and match the parcel to your order.

How to start a return
1. Email helloveluxe8@gmail.com with your order number and a short note on why you are sending it back.
2. We reply within one business day with the return address.
3. Send the hat back with a tracked service and reply with the tracking number.

Return shipping
If you changed your mind or the hat does not fit, the return shipping is on you; please use a tracked service. If your order arrived damaged, faulty or wrong, we cover the cost, and if we do not need it back, you keep it.

Packs
If you return all hats from a 3-hat or a 5-hat order, we refund the full order. If you return only some of them, we refund the price you paid per hat: $22.66 each from a 3-hat order and $20.39 each from a 5-hat order.

Shipping costs
Orders of 2 or more hats ship free. For a single hat, the shipping fee is refunded when the item arrived damaged, faulty or wrong.

Damaged or faulty items
Send us a photo and your order number within 30 days of delivery, the same 30 days as the guarantee. We send a replacement or refund you, whichever you prefer.

Exchanges
The hat comes in one size, so an exchange means another color, or a free replacement for a damaged, faulty or wrong item. For a damaged, faulty or wrong item, we pay the shipping both ways. For another color, send the hat back as a return within the 30 days and place a new order for the color you want.

Cancellations
Changed your mind before your order ships? Email us as soon as possible and we cancel it with a full refund.

Refunds
As soon as your hat is back with us, we send the refund to your original payment method. Your bank or card usually shows it a few business days later.

Questions
Write to helloveluxe8@gmail.com. A real person reads every email and replies within one business day.</textarea><button onclick="c('t2',this)">Copy</button></div></section></main><script>function c(i,b){var t=document.getElementById(i);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)}</script></body></html>
